<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Join Watch Room — Cineva</title>
<style>
:root {
  --bg: #06060c;
  --text: #f6f5f2;
  --t2: rgba(246, 245, 242, 0.68);
  --t3: rgba(246, 245, 242, 0.42);
  --a1: #7b6bff;
  --a2: #ff5fa8;
  --a3: #ffab5e;
  --a4: #38d5ff;
  --ok: #6ee7a0;
  --sans: "Geist Variable", "Geist", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
  --mono: "Geist Mono Variable", "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  overflow-x: hidden;
  position: relative;
}

a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }

/* Aurora liquid backdrop */
.aurora {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  background: radial-gradient(120% 80% at 50% -10%, #14123a, var(--bg) 60%);
  pointer-events: none;
}
.aurora i {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  mix-blend-mode: screen;
  will-change: transform;
}
.aurora i:nth-child(1) { width: 46vw; height: 46vw; left: -8vw; top: -12vw; background: var(--a1); opacity: .55; animation: f1 22s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { width: 38vw; height: 38vw; right: -6vw; top: 4vh; background: var(--a2); opacity: .42; animation: f2 26s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { width: 34vw; height: 34vw; left: 30vw; top: 42vh; background: var(--a4); opacity: .28; animation: f1 30s ease-in-out infinite alternate-reverse; }
.aurora i:nth-child(4) { width: 30vw; height: 30vw; right: 10vw; top: 70vh; background: var(--a3); opacity: .32; animation: f2 34s ease-in-out infinite alternate; }
.aurora::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .08;
  mix-blend-mode: overlay;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
@keyframes f1 { to { transform: translate3d(9vw, 7vh, 0) scale(1.15); } }
@keyframes f2 { to { transform: translate3d(-8vw, 9vh, 0) scale(0.9); } }

/* Liquid glass base class */
.lg {
  position: relative;
  isolation: isolate;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04) 48%, rgba(255, 255, 255, 0.11));
  -webkit-backdrop-filter: blur(28px) saturate(190%) brightness(1.08);
  backdrop-filter: blur(28px) saturate(190%) brightness(1.08);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, 0.6),
    inset 0 -1px 1px rgba(255, 255, 255, 0.14),
    inset 0 0 32px rgba(255, 255, 255, 0.05),
    0 30px 80px -15px rgba(0, 0, 0, 0.65),
    0 0 50px -10px rgba(123, 107, 255, 0.18);
  border-radius: 36px;
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.refract .lg {
  backdrop-filter: url(#lens) blur(12px) saturate(190%) brightness(1.08);
}
.lg::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.2px;
  pointer-events: none;
  z-index: 2;
  background: conic-gradient(
    from 210deg at 50% 50%,
    rgba(255, 255, 255, 0.75),
    rgba(255, 255, 255, 0.08) 18%,
    rgba(255, 255, 255, 0.05) 50%,
    rgba(255, 255, 255, 0.5) 72%,
    rgba(255, 255, 255, 0.08) 88%,
    rgba(255, 255, 255, 0.75)
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
}
.lg::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 1;
  opacity: 0.9;
  background: radial-gradient(380px circle at var(--mx, 30%) var(--my, 0%), rgba(255, 255, 255, 0.22), transparent 60%);
  transition: opacity 0.3s var(--ease);
}
.lg > * { position: relative; z-index: 3; }

/* Shell */
.app-shell {
  width: 100%;
  max-width: 530px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Nav pill */
.top-nav {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 42px;
  padding: 0 18px 0 14px;
  border-radius: 99px;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--t2);
  transition: transform 0.2s var(--ease), color 0.2s;
}
.top-nav:hover {
  color: #fff;
  transform: translateX(-3px);
}
.top-nav svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  fill: none;
}

/* Card */
.card {
  padding: 38px 36px 36px;
  overflow: hidden;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 14px 0 10px;
  border-radius: 99px;
  font-size: 13px;
  font-weight: 550;
  color: var(--t2);
  margin-bottom: 18px;
}
.badge svg {
  width: 14px;
  height: 14px;
  stroke: var(--a4);
  stroke-width: 2;
  fill: none;
}

h1 {
  font-size: 34px;
  font-weight: 650;
  letter-spacing: -0.035em;
  line-height: 1.15;
  color: var(--text);
}
.subtitle {
  margin-top: 8px;
  color: var(--t2);
  font-size: 15.5px;
  line-height: 1.45;
}

.form-group {
  margin-top: 24px;
}
.form-label {
  display: block;
  font-size: 14px;
  font-weight: 550;
  color: var(--t2);
  margin-bottom: 8px;
}

/* Code Input Box */
.input-wrap {
  position: relative;
  border-radius: 18px;
  background: rgba(0, 0, 0, 0.32);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  display: flex;
  align-items: center;
  transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
}
.input-wrap:focus-within {
  border-color: rgba(255, 255, 255, 0.38);
  box-shadow: 0 0 0 4px rgba(123, 107, 255, 0.2), inset 0 2px 6px rgba(0, 0, 0, 0.5);
  background: rgba(0, 0, 0, 0.42);
}
.input-wrap input {
  width: 100%;
  height: 52px;
  padding: 0 18px;
  background: transparent;
  border: 0;
  outline: none;
  font-size: 15.5px;
  color: var(--text);
}
.input-wrap input.code-input {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.input-wrap input::placeholder {
  color: var(--t3);
  font-family: var(--mono);
  letter-spacing: 0.12em;
}

/* Quick paste pill */
.paste-btn {
  position: absolute;
  right: 10px;
  height: 32px;
  padding: 0 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--t2);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.paste-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

/* 6-Character Grid Option (Cineva Code Style) */
.code-grid {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.code-cell {
  flex: 1;
  height: 58px;
  border-radius: 14px;
  text-align: center;
  font: 600 24px var(--mono);
  text-transform: uppercase;
  background: rgba(0, 0, 0, 0.32);
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4);
  color: #fff;
  transition: all 0.2s;
  outline: none;
}
.code-cell:focus {
  border-color: #fff;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2), inset 0 2px 5px rgba(0, 0, 0, 0.4);
  transform: translateY(-2px);
}

/* Primary Button */
.btn-primary {
  width: 100%;
  height: 54px;
  margin-top: 28px;
  border-radius: 99px;
  border: 0;
  cursor: pointer;
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(180deg, #ffffff, #e6e3ff);
  color: #1b1540;
  box-shadow:
    inset 0 -2px 6px rgba(123, 107, 255, 0.28),
    0 12px 35px -6px rgba(180, 170, 255, 0.7);
  transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow:
    inset 0 -2px 6px rgba(123, 107, 255, 0.35),
    0 16px 42px -6px rgba(180, 170, 255, 0.85);
}
.btn-primary:active {
  transform: scale(0.985);
}

/* Footer Link */
.footer-switch {
  text-align: center;
  margin-top: 24px;
  font-size: 14.5px;
  color: var(--t2);
}
.footer-switch a {
  color: #fff;
  font-weight: 550;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: opacity 0.2s;
}
.footer-switch a:hover {
  opacity: 0.85;
}

/* Simulated Room Connecting Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(6, 6, 12, 0.75);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s var(--ease);
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-box {
  width: min(500px, 100%);
  padding: 34px 30px;
  text-align: center;
  transform: scale(0.94);
  transition: transform 0.3s var(--ease);
}
.modal-overlay.open .modal-box {
  transform: scale(1);
}
.spinner {
  width: 48px;
  height: 48px;
  border: 3.5px solid rgba(255, 255, 255, 0.15);
  border-top-color: var(--a1);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- SVG displacement lens for Chromium -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".009 .014" numOctaves="2" seed="7" result="n"/>
      <feGaussianBlur in="n" stdDeviation="3" result="m"/>
      <feDisplacementMap in="SourceGraphic" in2="m" scale="38" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div class="aurora" aria-hidden="true">
  <i></i><i></i><i></i><i></i>
</div>

<main class="app-shell">
  <!-- Back to Home navigation -->
  <a href="/" class="top-nav lg">
    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Back to Home</span>
  </a>

  <!-- Join Watch Room Card -->
  <section class="card lg">
    <div class="badge lg">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Join Watch Party</span>
    </div>

    <h1>Join a watch room</h1>
    <p class="subtitle">Enter the room code to sync up with your friends.</p>

    <form id="joinForm" autocomplete="off">
      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <label class="form-label" style="margin:0;">Room code</label>
          <span style="font-size:12px; color:var(--t3); font-family:var(--mono);">6-CHAR CODE</span>
        </div>
        
        <!-- 6 Character Cineva Input Grid -->
        <div class="code-grid" id="codeGrid">
          <input class="code-cell" maxlength="1" aria-label="Digit 1" autofocus>
          <input class="code-cell" maxlength="1" aria-label="Digit 2">
          <input class="code-cell" maxlength="1" aria-label="Digit 3">
          <input class="code-cell" maxlength="1" aria-label="Digit 4">
          <input class="code-cell" maxlength="1" aria-label="Digit 5">
          <input class="code-cell" maxlength="1" aria-label="Digit 6">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="joinName">Your name</label>
        <div class="input-wrap">
          <input type="text" id="joinName" placeholder="e.g. Alex" required>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="joinSubmit">
        <span>Join Room</span>
      </button>

      <div class="footer-switch">
        <span>Want to host instead?</span>
        <a href="create.html">Create your own room &rarr;</a>
      </div>
    </form>
  </section>
</main>

<!-- Connecting Status Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box lg">
    <div class="spinner"></div>
    <h2>Connecting to Room...</h2>
    <p class="subtitle" style="margin-top:6px;" id="statusText">Synchronizing clocks and video stream with host.</p>
    <button type="button" class="btn-primary" style="margin-top:20px;" onclick="document.getElementById('modal').classList.remove('open')">
      Cancel
    </button>
  </div>
</div>

<script>
(function() {
  const d = document;

  /* Chromium lens refraction detection */
  try {
    if (CSS.supports('backdrop-filter', 'url(#lens)') && !matchMedia('(prefers-reduced-transparency:reduce)').matches) {
      d.documentElement.classList.add('refract');
    }
  } catch(e) {}

  /* Pointer specular tracking */
  d.addEventListener('pointermove', function(e) {
    const el = e.target.closest && e.target.closest('.lg');
    if (!el) return;
    const rect = el.getBoundingClientRect();
    el.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
    el.style.setProperty('--my', (e.clientY - rect.top) + 'px');
  });

  /* 6-box input logic (autofocus, backspace, paste) */
  const cells = Array.from(d.querySelectorAll('.code-cell'));
  cells.forEach((cell, idx) => {
    cell.addEventListener('input', () => {
      cell.value = cell.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      if (cell.value && cells[idx + 1]) {
        cells[idx + 1].focus();
      }
    });

    cell.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !cell.value && cells[idx - 1]) {
        cells[idx - 1].focus();
      }
    });

    cell.addEventListener('paste', (e) => {
      e.preventDefault();
      const text = (e.clipboardData.getData('text') || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase().slice(0, 6);
      text.split('').forEach((char, i) => {
        if (cells[i]) cells[i].value = char;
      });
      const targetFocus = Math.min(text.length, 5);
      cells[targetFocus].focus();
    });
  });

  /* Form Submit */
  const form = d.getElementById('joinForm');
  const modal = d.getElementById('modal');
  const statusText = d.getElementById('statusText');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const code = cells.map(c => c.value).join('');
    if (code.length < 6) {
      alert('Please enter all 6 characters of the room code.');
      cells.find(c => !c.value)?.focus();
      return;
    }
    statusText.textContent = `Joining room "${code}" as ${d.getElementById('joinName').value}...`;
    modal.classList.add('open');
  });
})();
</script>
</body>
</html>
