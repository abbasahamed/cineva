name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main, 'feature/**' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    env:
      NODE_ENV: test
      CI: true
      DATABASE_URL: "file:./dev.db"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install media tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install media tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress -y
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@cineva/shared

      - name: Initialize test database
        run: npm run db:push --workspace=@cineva/server

      - name: Typecheck
        run: npm run typecheck

      - name: Run server tests
        run: npm test --workspace=@cineva/server

      - name: Run web frontend tests
        run: npm test --workspace=@cineva/web

      - name: Production build
        run: npm run build
